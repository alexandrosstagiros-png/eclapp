# Included from nginx's http context (Ubuntu sites-enabled).
# install-miniapp.sh replaces 'sha256-0jvHbIFae6ks5/9L2dIfqvtWwT+cALFQxrD+stcDMpg=' from the actual index.html.
limit_req_zone $binary_remote_addr zone=transport_miniapp:1m rate=5r/s;

server {
    listen 80;
    server_name 170.168.112.23;
    if ($host != "170.168.112.23") { return 444; }
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://170.168.112.23$request_uri; }
}

server {
    listen 443 ssl;
    server_name 170.168.112.23;
    if ($host != "170.168.112.23") { return 444; }
    ssl_certificate /etc/letsencrypt/live/170.168.112.23/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/170.168.112.23/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:transport_miniapp_tls:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/transport-miniapp;
    disable_symlinks on;
    autoindex off;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/transport-miniapp.error.log warn;
    client_max_body_size 36m;
    client_body_timeout 30s;
    send_timeout 30s;

    # Telegram and MAX web clients embed the page; native WebViews load it directly.
    # Do not add X-Frame-Options DENY/SAMEORIGIN to the static application.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://telegram.org https://st.max.ru 'sha256-0jvHbIFae6ks5/9L2dIfqvtWwT+cALFQxrD+stcDMpg='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://*.telegram.org https://max.ru https://*.max.ru" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=86400" always;

    location ~ /\. { return 404; }
    location ~* ^/api/v1/auth/(dev|demo)(/|$) { return 404; }
    location /api/v1/ {
        limit_req zone=transport_miniapp burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Replace client-supplied forwarding headers; never append untrusted values.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Dev-Auth-Key "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }
    location ~ ^/assets/[A-Za-z0-9_-]+\.(js|css|png|jpg|jpeg|svg|webp|ico|woff|woff2|ttf)$ {
        try_files $uri =404;
    }
    # No SPA fallback for unknown assets, API paths, source maps, or source files.
    location / { return 404; }
}
