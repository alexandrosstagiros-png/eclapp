name: Deploy VK Cloud

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A deployment must finish its migrations and health check before another starts.
concurrency:
  group: vk-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy checked main to VK Cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: >-
      github.repository == 'alexandrosstagiros-png/eclapp' &&
      !github.event.repository.fork &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    steps:
      - name: Explain inactive deployment
        if: vars.VK_DEPLOY_ENABLED != 'true'
        run: |
          echo 'Deployment is disabled. Complete docs/VK_CLOUD_DEPLOYMENT.md, then set VK_DEPLOY_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"

      - name: Select current main only after its successful push CI
        id: revision
        if: vars.VK_DEPLOY_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          repository = os.environ['REPOSITORY']
          if repository != 'alexandrosstagiros-png/eclapp':
              raise SystemExit('Unexpected source repository')

          def api(path):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repository + '/' + path,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def skip(message):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('deploy=false\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(message + '\n')
              raise SystemExit(0)

          sha = api('git/ref/heads/main')['object']['sha']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid main commit SHA')
          if os.environ['EVENT_NAME'] == 'workflow_run' and os.environ['EVENT_SHA'] != sha:
              skip('Skipped: this CI run is for an older main commit. The current main must pass CI first.')

          query = urllib.parse.urlencode({
              'branch': 'main', 'event': 'push', 'head_sha': sha, 'per_page': 100,
          })
          runs = api('actions/workflows/ci.yml/runs?' + query)['workflow_runs']
          runs = [run for run in runs if
                  run.get('head_sha') == sha and
                  run.get('head_branch') == 'main' and
                  run.get('event') == 'push' and
                  (run.get('head_repository') or {}).get('full_name') == repository]
          if not runs:
              raise SystemExit('Current main has no push CI run; run/push CI before deploying')
          latest = max(runs, key=lambda run: (run['run_number'], run.get('run_attempt', 1)))
          if latest.get('status') != 'completed' or latest.get('conclusion') != 'success':
              raise SystemExit('Latest push CI for current main has not succeeded; deployment refused')
          if os.environ['EVENT_NAME'] == 'workflow_run' and str(latest['id']) != os.environ['EVENT_RUN_ID']:
              skip('Skipped: a newer CI run exists for the same commit.')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('deploy=true\nsha=' + sha + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Selected main commit `' + sha + '` after successful push CI.\n')
          PY

      - name: Check out verified source revision
        if: steps.revision.outputs.deploy == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false

      - name: Package tracked repository source
        if: steps.revision.outputs.deploy == 'true'
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          git archive --format=tar.gz --output="$RUNNER_TEMP/$DEPLOY_SHA.tar.gz" "$DEPLOY_SHA"

      - name: Upload and deploy with pinned SSH host key
        if: steps.revision.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
          DEPLOY_HOST: ${{ secrets.VK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.VK_DEPLOY_USER || 'ecl-deploy' }}
          DEPLOY_KEY: ${{ secrets.VK_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.VK_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]{0,252}$ ]] || { echo 'Set VK_DEPLOY_HOST to the server IPv4 address or DNS name'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo 'Invalid SSH user'; exit 1; }
          test -n "$DEPLOY_KEY" || { echo 'Missing VK_DEPLOY_SSH_KEY'; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Missing VK_DEPLOY_KNOWN_HOSTS'; exit 1; }

          ssh_dir="$RUNNER_TEMP/ecl-deploy-ssh"
          install -m 700 -d "$ssh_dir"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/private-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$ssh_dir/known_hosts" > /dev/null || { echo 'Pinned known_hosts entry is missing for VK_DEPLOY_HOST'; exit 1; }
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS

          ssh_options=(
            -i "$ssh_dir/private-key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          scp "${ssh_options[@]}" "$RUNNER_TEMP/$DEPLOY_SHA.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:/home/ecl-deploy/incoming/$DEPLOY_SHA.tar.gz"

          # A queued job can become stale while it uploads. Do not replace a newer main.
          current_sha="$(gh api repos/alexandrosstagiros-png/eclapp/git/ref/heads/main --jq .object.sha)"
          if [[ "$current_sha" != "$DEPLOY_SHA" ]]; then
            echo 'Skipped deployment: main changed during upload. Its own successful CI will trigger deployment.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -- /usr/local/sbin/ecl-deploy /home/ecl-deploy/incoming/$DEPLOY_SHA.tar.gz $DEPLOY_SHA"
          echo "Deployed commit \`$DEPLOY_SHA\`; server readiness check passed." >> "$GITHUB_STEP_SUMMARY"
